aid: xellsmart
name: XellSmart Biomedical
description: XellSmart Biomedical (士泽生物医药) is a clinical-stage biotechnology company
  based in Suzhou and Shanghai, China, founded in 2021 by Dr. Xiang Li. The company
  develops clinical-grade, allogeneic, off-the-shelf iPSC-derived cell therapies for
  central nervous system diseases, with NMPA- and U.S. FDA-cleared registrational
  clinical trials in Parkinson's disease, spinal cord injury, and ALS. XellSmart is
  a Qiming Venture Partners portfolio company and publishes no public developer or
  API surface.
